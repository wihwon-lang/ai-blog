name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  # 예약발행: 매일 한국시간 08:00에 다시 빌드해서 발행일이 된 글을 공개 (GitHub 사정으로 수십 분 늦을 수 있음)
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
